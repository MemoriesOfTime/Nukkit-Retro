name: Build

# 注意: push 事件不能同时过滤 branches 和 tags（两者都定义时需要同时满足，
# 而 ref 只能是分支或 tag 之一，会导致永不触发），所以这里不过滤 push，
# 由下方 job 的 if 条件区分 tag 推送。
on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build (Java 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build
        run: mvn -B -ntp clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nukkit-Retro
          path: target/nukkit-retro-SNAPSHOT.jar
          if-no-files-found: error

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: Nukkit-Retro
          path: target/

      - name: Rename JAR with tag
        run: |
          TAG="${GITHUB_REF_NAME//\//-}"
          cp target/nukkit-retro-SNAPSHOT.jar "Nukkit-Retro-${TAG}.jar"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: Nukkit-Retro-${{ env.TAG }}.jar
          generate_release_notes: true

  # 滚动快照发布: 每次 master 更新后, 删除并重建固定的 "snapshot" 预发布,
  # 下载链接永久有效: /releases/download/snapshot/Nukkit-Retro-snapshot.jar
  snapshot:
    name: Snapshot release (rolling)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: Nukkit-Retro
          path: target/

      - name: Publish rolling snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv target/nukkit-retro-SNAPSHOT.jar Nukkit-Retro-snapshot.jar
          gh release delete snapshot --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create snapshot Nukkit-Retro-snapshot.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Nukkit-Retro Snapshot" \
            --notes "Automated snapshot build of master @ ${{ github.sha }}. May be unstable; prefer tagged releases for stable builds."
